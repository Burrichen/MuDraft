name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Check and compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install  # reads rust-toolchain.toml
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint, type-check, and test (web + Rust)
        run: npm run check

      # The embedded WebDriver server must never be part of a normal build.
      - name: Test-only automation is not in the release dependency graph
        shell: bash
        run: npm run check:isolation

      # Compiles the release app without producing or publishing installers.
      - name: Compile release desktop binary
        run: npm run build:native

  e2e:
    name: Native end-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Windows drives the app through tauri-driver and the msedgedriver matching the
      # installed WebView2 runtime (macOS uses the server the test build embeds).
      - name: Install tauri-driver and msedgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          "TAURI_NATIVE_DRIVER=$dir\msedgedriver.exe" >> $env:GITHUB_ENV

      # Debug build with `--features e2e`: fixtures replace MusicBrainz and native
      # dialogs (plus an embedded WebDriver server on macOS). Never shipped.
      - name: Build the test app
        run: npm run e2e:build

      - name: Run the native journey
        run: npm run e2e
