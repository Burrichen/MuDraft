name: Release

# Builds the next MuDraft release for BOTH platforms from ONE commit:
#   - MuDraft_<version>_windows_x64_setup.exe  (NSIS, per-user, offline WebView2)
#   - MuDraft_<version>_macos_universal.dmg    (MuDraft.app for arm64 + x86_64)
# Order: version check → full test gate on Windows and macOS → build each installer →
# verify installers on real runners (Windows x64, Apple Silicon, Intel Mac) → one DRAFT
# GitHub release with both files and SHA256SUMS.txt.
#
# Nothing is published automatically. If any job fails, no draft is created or updated.
# A maintainer reviews the draft and publishes it by hand (see docs/RELEASE.md).
#
# Triggers: pushes to `release/**` branches, and manual runs.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # package.json, package-lock.json, tauri.conf.json, Cargo.toml and Cargo.lock must
      # agree, and docs/release-notes/v<version>.md must exist.
      - name: Check version metadata
        id: version
        run: node scripts/release/check-version.mjs >> "$GITHUB_OUTPUT"

  test:
    name: Test gate (${{ matrix.os }})
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint, type-check, and test (web + Rust, incl. two-profile sync journeys)
        run: npm run check

      - name: Test-only automation is not in the release dependency graph
        shell: bash
        run: npm run check:isolation

      # The token store against the real OS store. macOS gets a throwaway, unlocked
      # keychain so nothing prompts; Windows uses the runner user's Credential Manager.
      - name: Prepare a throwaway keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          kc="$RUNNER_TEMP/mudraft-ci.keychain-db"
          security create-keychain -p mudraft-ci "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p mudraft-ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"

      - name: Secure token store round trip (Keychain / Credential Manager)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib os_secure_store -- --ignored

  # Real GitHub, two separate profiles, one OS at a time (they share the test repository).
  # Runs only when a dedicated private test repository is configured; never a personal PAT.
  live-sync:
    name: Live sync test (${{ matrix.os }})
    needs: test
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MUDRAFT_SYNC_TEST_OWNER: ${{ vars.MUDRAFT_SYNC_TEST_OWNER }}
      MUDRAFT_SYNC_TEST_REPO: ${{ vars.MUDRAFT_SYNC_TEST_REPO }}
      MUDRAFT_SYNC_TEST_TOKEN: ${{ secrets.MUDRAFT_SYNC_TEST_TOKEN }}
    steps:
      - name: Skip unless configured
        id: configured
        shell: bash
        run: |
          if [ -z "$MUDRAFT_SYNC_TEST_TOKEN" ] || [ -z "$MUDRAFT_SYNC_TEST_OWNER" ] || [ -z "$MUDRAFT_SYNC_TEST_REPO" ]; then
            echo "::notice::Live GitHub sync test skipped: set the MUDRAFT_SYNC_TEST_OWNER/REPO variables and the MUDRAFT_SYNC_TEST_TOKEN secret (docs/RELEASE.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: steps.configured.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.configured.outputs.run == 'true'
        with:
          workspaces: src-tauri

      - name: Sync two profiles through the private test repository
        if: steps.configured.outputs.run == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib live_ -- --ignored

  windows:
    name: Windows x64 installer
    needs: [meta, test]
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Optional Authenticode signing: repository secrets WINDOWS_CERTIFICATE (base64 .pfx)
      # and WINDOWS_CERTIFICATE_PASSWORD, optional variable WINDOWS_TIMESTAMP_URL.
      # Without them the installer is unsigned and the release says so.
      - name: Configure signing (only when a certificate secret exists)
        id: signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host 'No signing certificate configured: building an UNSIGNED installer.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = $timestamp
          } } } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:RUNNER_TEMP 'signing.json')
          "signed=true" >> $env:GITHUB_OUTPUT

      # The latest published release is the upgrade baseline, so the real migration path
      # (older schema → this one) is exercised on an installed copy.
      - name: Download the previous release (upgrade baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'baseline')
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*_windows_x64_setup.exe' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'could not download the previous Windows installer' }
          $old = Get-ChildItem $dir -Filter 'MuDraft_*_windows_x64_setup.exe' | Select-Object -First 1
          if (-not $old) { throw 'the latest release has no Windows installer' }
          $oldVersion = $old.Name -replace '^MuDraft_(.+)_windows_x64_setup\.exe$', '$1'
          Write-Host "Upgrade baseline: $($old.Name) ($oldVersion)"
          "OLD_INSTALLER=$($old.FullName)" >> $env:GITHUB_ENV
          "OLD_VERSION=$oldVersion" >> $env:GITHUB_ENV

      - name: Build release installer
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $cli = @('tauri', 'build', '--ci', '--bundles', 'nsis')
          if ($env:SIGNED -eq 'true') { $cli += @('--config', (Join-Path $env:RUNNER_TEMP 'signing.json')) }
          npx @cli
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          New-Item -ItemType Directory -Force release | Out-Null
          $out = "release/MuDraft_$($env:VERSION)_windows_x64_setup.exe"
          Move-Item "src-tauri/target/release/bundle/nsis/MuDraft_$($env:VERSION)_x64-setup.exe" $out
          $size = (Get-Item $out).Length
          Write-Host ("Installer: {0} ({1:N1} MB)" -f $out, ($size / 1MB))
          if ($size -lt 100MB) { throw 'Installer is too small to contain the offline WebView2 installer' }
          if ((Get-Item $out).VersionInfo.ProductVersion -notlike "$($env:VERSION)*") { throw 'Installer version metadata does not match' }
          $sig = Get-AuthenticodeSignature $out
          Write-Host "Authenticode status: $($sig.Status)"
          if ($env:SIGNED -eq 'true' -and $sig.Status -eq 'NotSigned') { throw 'Signing was configured but the installer is not signed' }
          if ($env:SIGNED -ne 'true' -and $sig.Status -ne 'NotSigned') { throw 'Unexpected signature on an unsigned build' }

      - name: Verify install, Start menu launch, restart, upgrade, and uninstall
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ./scripts/windows/verify-install.ps1 `
            -Installer "release/MuDraft_$($env:VERSION)_windows_x64_setup.exe" `
            -OldInstaller $env:OLD_INSTALLER -Version $env:VERSION -OldVersion $env:OLD_VERSION `
            -Shots verify-shots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MuDraft-windows-x64
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-verify-screenshots
          path: verify-shots/
          if-no-files-found: ignore

  macos:
    name: macOS universal DMG
    needs: [meta, test]
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--target universal-apple-darwin` needs both Apple targets (Tauri CLI docs).
      - name: Install pinned Rust toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Without a Developer ID the app is ad-hoc signed (`signingIdentity: "-"` in
      # tauri.conf.json) and not notarized. With the optional secrets below, Tauri signs
      # with the Developer ID and notarizes (docs/RELEASE.md lists them).
      - name: Configure signing (only when a Developer ID certificate secret exists)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # All six or none: a signed build is always notarized, so the release notes stay true.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ] ||
             [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "No complete Developer ID + notarization configuration: ad-hoc signed, not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --arg id "$APPLE_SIGNING_IDENTITY" '{bundle: {macOS: {signingIdentity: $id}}}' > "$RUNNER_TEMP/signing.json"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Same code, older version number: only the upgrade baseline. Never published.
      - name: Build upgrade-test baseline (0.9.0, universal, not published)
        run: |
          echo '{"version": "0.9.0"}' > "$RUNNER_TEMP/baseline.json"
          npx tauri build --ci --target universal-apple-darwin --bundles app --config "$RUNNER_TEMP/baseline.json"
          mkdir -p baseline
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/MuDraft.app baseline/MuDraft-0.9.0.zip

      - name: Build release DMG (universal)
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ needs.meta.outputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(tauri build --ci --target universal-apple-darwin --bundles app,dmg)
          if [ "$SIGNED" = true ]; then
            args+=(--config "$RUNNER_TEMP/signing.json")
          else
            # Tauri treats a set-but-empty APPLE_CERTIFICATE as a certificate to import.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx "${args[@]}"
          mkdir -p release
          cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/MuDraft_${VERSION}_universal.dmg" \
            "release/MuDraft_${VERSION}_macos_universal.dmg"
          ls -l release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MuDraft-macos-universal
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-upgrade-baseline
          path: baseline/
          if-no-files-found: error

  # The same DMG on Apple Silicon and on an Intel Mac, so both architectures really run.
  macos-verify:
    name: Verify DMG (${{ matrix.runner }})
    needs: [meta, macos]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MuDraft-macos-universal
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-upgrade-baseline
          path: baseline

      - name: Install Rosetta (Apple Silicon only, to also run the Intel slice)
        if: runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || echo "Rosetta unavailable"

      - name: Verify DMG, launch, restart, upgrade, and uninstall
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          ./scripts/macos/verify-install.sh "release/MuDraft_${VERSION}_macos_universal.dmg" \
            baseline/MuDraft-0.9.0.zip "$VERSION" 0.9.0 verify-shots "$SIGNED"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-verify-screenshots-${{ matrix.runner }}
          path: verify-shots/
          if-no-files-found: ignore

  release:
    name: Draft GitHub release (both platforms)
    needs: [meta, test, live-sync, windows, macos, macos-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MuDraft-windows-x64
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MuDraft-macos-universal
          path: release

      - name: Check assets and write checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd release
          ls -l
          test -f "MuDraft_${VERSION}_windows_x64_setup.exe"
          test -f "MuDraft_${VERSION}_macos_universal.dmg"
          test "$(ls | wc -l)" -eq 2
          sha256sum "MuDraft_${VERSION}_windows_x64_setup.exe" "MuDraft_${VERSION}_macos_universal.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          WIN_SIGNED: ${{ needs.windows.outputs.signed }}
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          win=$([ "$WIN_SIGNED" = true ] && echo "Authenticode-signed." || echo "**Unsigned.** Windows SmartScreen or antivirus software may warn; choose More info → Run anyway only if the checksum matches.")
          mac=$([ "$MAC_SIGNED" = true ] && echo "Signed with a Developer ID and notarized." || echo "**Ad-hoc signed, not notarized.** macOS will block the first launch; approve it once in System Settings → Privacy & Security → Open Anyway (docs/MACOS.md). Never disable Gatekeeper.")
          {
            cat "docs/release-notes/v${VERSION}.md"
            echo
            echo "## Downloads"
            echo
            echo "| File | Platform | SHA-256 |"
            echo "| --- | --- | --- |"
            while read -r sum file; do
              case $file in
                *windows*) platform="Windows 10/11 x64 installer" ;;
                *macos*) platform="macOS 12+ disk image, Apple Silicon and Intel" ;;
              esac
              echo "| \`$file\` | $platform | \`$sum\` |"
            done < release/SHA256SUMS.txt
            echo
            echo "## Signing"
            echo
            echo "- Windows: $win"
            echo "- macOS: $mac"
            echo
            echo "Both files were built from commit \`${GITHUB_SHA}\` and verified on Windows x64, Apple Silicon, and Intel Mac runners ([workflow run](${RUN_URL}))."
          } > notes.md
          cat notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          WIN_SIGNED: ${{ needs.windows.outputs.signed }}
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          tag="v${VERSION}"
          title="MuDraft ${tag} — Windows x64 and macOS universal"
          if [ "$WIN_SIGNED" != true ] || [ "$MAC_SIGNED" != true ]; then
            title="${title} (unsigned personal release)"
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::${tag} is already published. Bump the version for a new release."
              exit 1
            fi
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets \
            --jq '"Draft: \(.isDraft)  \(.url)", (.assets[] | "  \(.name)  \(.size) bytes")'
