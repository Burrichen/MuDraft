[package]
name = "mudraft"
version = "1.0.0"
description = "Local-first music backlog, picker, and collection"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "mudraft_lib"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[features]
# Native end-to-end tests (WebdriverIO): fixtures, dialog overrides, and on macOS an
# embedded automation server. Test builds only.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
csv = "1.4.0"
unicode-normalization = "0.1.25"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.1", features = ["v7"] }
getrandom = "0.4.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10.9"

# Native E2E only, macOS: an embedded WebDriver server (Windows/Linux use tauri-driver).
# Never enabled in release builds.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "test-util"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
